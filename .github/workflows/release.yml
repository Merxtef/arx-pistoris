name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Validate tag
        shell: bash
        run: |
          set -euo pipefail

          project_version=$(
            sed -nE 's/^project\(arx-pistoris VERSION ([0-9]+\.[0-9]+\.[0-9]+) LANGUAGES.*$/\1/p' CMakeLists.txt
          )
          [[ -n "$project_version" ]] || { echo "Could not read the CMake project version" >&2; exit 1; }
          [[ "$GITHUB_REF_NAME" == "v$project_version" ]] || {
            echo "Tag $GITHUB_REF_NAME does not match project version $project_version" >&2
            exit 1
          }

          git fetch --no-tags origin main
          release_commit=$(git rev-list -n 1 "$GITHUB_REF_NAME")
          git merge-base --is-ancestor "$release_commit" origin/main || {
            echo "Release commit is not reachable from main" >&2
            exit 1
          }

  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build ${{ matrix.asset }}
    needs:
      - validate
      - ci
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            asset: arx-pistoris-windows-x64.zip
            cmake_args: ''
          - os: ubuntu-24.04
            asset: arx-pistoris-linux-x64.tar.gz
            cmake_args: >-
              -DCMAKE_CXX_FLAGS=--gcc-toolchain=/usr
              -DCMAKE_EXE_LINKER_FLAGS=--gcc-toolchain=/usr
              -DCMAKE_SHARED_LINKER_FLAGS=--gcc-toolchain=/usr

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-llvm

      - name: Tool versions
        run: |
          cmake --version
          clang++ --version
          ninja --version

      - name: Configure
        run: >
          cmake --preset release
          -DARX_WARNINGS_AS_ERRORS=ON
          ${{ matrix.cmake_args }}

      - name: Build CLI
        run: cmake --build --preset release --target arx_pistoris_cli --parallel

      - name: Install CLI
        run: cmake --install build-release --prefix package/arx-pistoris

      - name: Smoke test Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/package-smoke.ps1 package/arx-pistoris

      - name: Smoke test Linux package
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/ci/package-smoke.sh package/arx-pistoris

      - name: Package Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path package/arx-pistoris -DestinationPath ${{ matrix.asset }} -Force

      - name: Package Linux archive
        if: runner.os == 'Linux'
        shell: bash
        run: tar -czf ${{ matrix.asset }} -C package arx-pistoris

      - name: Upload package artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
