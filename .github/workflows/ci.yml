name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-llvm

      - name: Check formatting
        run: |
          cmake --preset dev -DARX_BUILD_INFO_LIVE=OFF
          cmake --build --preset dev --target format-check

  tidy:
    name: Clang-Tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-llvm

      - name: Configure
        run: >
          cmake --preset tidy-check
          -DARX_WARNINGS_AS_ERRORS=ON
          -DCMAKE_CXX_FLAGS=--gcc-toolchain=/usr
          -DCMAKE_EXE_LINKER_FLAGS=--gcc-toolchain=/usr
          -DCMAKE_SHARED_LINKER_FLAGS=--gcc-toolchain=/usr

      - name: Build
        run: cmake --build --preset tidy-check --parallel

  platform:
    name: Platform (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
            cmake_args: ''
          - name: Linux
            os: ubuntu-24.04
            cmake_args: >-
              -DCMAKE_CXX_FLAGS=--gcc-toolchain=/usr
              -DCMAKE_EXE_LINKER_FLAGS=--gcc-toolchain=/usr
              -DCMAKE_SHARED_LINKER_FLAGS=--gcc-toolchain=/usr

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-llvm

      - name: Tool versions
        run: |
          cmake --version
          clang++ --version
          ninja --version

      - name: Configure development build
        run: >
          cmake --preset dev
          -DARX_WARNINGS_AS_ERRORS=ON
          -DARX_BUILD_INFO_LIVE=OFF
          ${{ matrix.cmake_args }}

      - name: Build development targets
        run: cmake --build --preset dev --parallel

      - name: Test
        run: ctest --preset dev

      - name: Configure release package
        run: >
          cmake --preset release
          -DARX_WARNINGS_AS_ERRORS=ON
          ${{ matrix.cmake_args }}

      - name: Build release CLI
        run: cmake --build --preset release --target arx_pistoris_cli --parallel

      - name: Install release CLI
        run: |
          cmake -E remove_directory package
          cmake --install build-release --prefix package/arx-pistoris

      - name: Smoke test Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/package-smoke.ps1 package/arx-pistoris

      - name: Smoke test Linux package
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/ci/package-smoke.sh package/arx-pistoris

  sanitize:
    name: Sanitizers (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
            cmake_args: ''
          - name: Linux
            os: ubuntu-24.04
            cmake_args: >-
              -DCMAKE_CXX_FLAGS=--gcc-toolchain=/usr
              -DCMAKE_EXE_LINKER_FLAGS=--gcc-toolchain=/usr
              -DCMAKE_SHARED_LINKER_FLAGS=--gcc-toolchain=/usr

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-llvm

      - name: Configure
        run: >
          cmake --preset sanitize
          -DARX_WARNINGS_AS_ERRORS=ON
          -DARX_BUILD_INFO_LIVE=OFF
          ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build --preset sanitize --parallel

      - name: Test
        run: ctest --preset sanitize

  fuzz-build:
    name: Fuzz Build
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-llvm

      - name: Configure
        run: >
          cmake --preset fuzz
          -DARX_WARNINGS_AS_ERRORS=ON
          -DCMAKE_CXX_FLAGS=--gcc-toolchain=/usr
          -DCMAKE_EXE_LINKER_FLAGS=--gcc-toolchain=/usr
          -DCMAKE_SHARED_LINKER_FLAGS=--gcc-toolchain=/usr

      - name: Build
        run: cmake --build --preset fuzz --parallel

      - name: Replay fixture seeds
        run: ctest --test-dir build-fuzz --output-on-failure -L fuzz-smoke

  gate:
    name: Gate
    if: always()
    needs:
      - format
      - tidy
      - platform
      - sanitize
      - fuzz-build
    runs-on: ubuntu-24.04

    steps:
      - name: Verify required jobs
        if: >-
          needs.format.result != 'success' ||
          needs.tidy.result != 'success' ||
          needs.platform.result != 'success' ||
          needs.sanitize.result != 'success' ||
          needs.fuzz-build.result != 'success'
        run: exit 1

      - run: echo "All required CI jobs passed"
