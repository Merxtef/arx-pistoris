name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-llvm

      - name: Check formatting
        run: |
          cmake --preset dev -DARX_BUILD_INFO_LIVE=OFF
          cmake --build --preset dev --target format-check

  tidy:
    name: Clang-Tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: ./.github/actions/setup-llvm

      - name: Configure
        run: >
          cmake --preset tidy-check
          -DARX_BUILD_PYTHON_BINDINGS=ON
          -DARX_WARNINGS_AS_ERRORS=ON
          -DCMAKE_CXX_FLAGS=--gcc-toolchain=/usr
          -DCMAKE_EXE_LINKER_FLAGS=--gcc-toolchain=/usr
          -DCMAKE_SHARED_LINKER_FLAGS=--gcc-toolchain=/usr

      - name: Build
        run: cmake --build --preset tidy-check --parallel

  platform:
    name: Platform (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
            cmake_args: ''
          - name: Linux
            os: ubuntu-24.04
            cmake_args: >-
              -DCMAKE_CXX_FLAGS=--gcc-toolchain=/usr
              -DCMAKE_EXE_LINKER_FLAGS=--gcc-toolchain=/usr
              -DCMAKE_SHARED_LINKER_FLAGS=--gcc-toolchain=/usr

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-llvm

      - name: Tool versions
        run: |
          cmake --version
          clang++ --version
          ninja --version

      - name: Configure development build
        run: >
          cmake --preset dev
          -DARX_WARNINGS_AS_ERRORS=ON
          -DARX_BUILD_INFO_LIVE=OFF
          ${{ matrix.cmake_args }}

      - name: Build development targets
        run: cmake --build --preset dev --parallel

      - name: Test
        run: ctest --preset dev

      - name: Configure release package
        run: >
          cmake --preset release
          -DARX_WARNINGS_AS_ERRORS=ON
          ${{ matrix.cmake_args }}

      - name: Build release CLI
        run: cmake --build --preset release --target arx_pistoris_cli --parallel

      - name: Install release CLI
        run: |
          cmake -E remove_directory package
          cmake --install build-release --prefix package/arx-pistoris

      - name: Smoke test Windows package
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/ci/package-smoke.ps1 package/arx-pistoris

      - name: Smoke test Linux package
        if: runner.os == 'Linux'
        shell: bash
        run: bash scripts/ci/package-smoke.sh package/arx-pistoris

  sanitize:
    name: Sanitizers (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
            cmake_args: ''
          - name: Linux
            os: ubuntu-24.04
            cmake_args: >-
              -DCMAKE_CXX_FLAGS=--gcc-toolchain=/usr
              -DCMAKE_EXE_LINKER_FLAGS=--gcc-toolchain=/usr
              -DCMAKE_SHARED_LINKER_FLAGS=--gcc-toolchain=/usr

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-llvm

      - name: Configure
        run: >
          cmake --preset sanitize
          -DARX_WARNINGS_AS_ERRORS=ON
          -DARX_BUILD_INFO_LIVE=OFF
          ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build --preset sanitize --parallel

      - name: Test
        run: ctest --preset sanitize

  fuzz-build:
    name: Fuzz Build
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-llvm

      - name: Configure
        run: >
          cmake --preset fuzz
          -DARX_WARNINGS_AS_ERRORS=ON
          -DCMAKE_CXX_FLAGS=--gcc-toolchain=/usr
          -DCMAKE_EXE_LINKER_FLAGS=--gcc-toolchain=/usr
          -DCMAKE_SHARED_LINKER_FLAGS=--gcc-toolchain=/usr

      - name: Build
        run: cmake --build --preset fuzz --parallel

      - name: Replay fixture seeds
        run: ctest --test-dir build-fuzz --output-on-failure -L fuzz-smoke

  python-source:
    name: Python source distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build and verify source distribution
        run: |
          python -m pip install build twine
          python -m build --sdist
          python -m twine check dist/*.tar.gz

      - name: Build and test source distribution
        run: |
          python -m pip wheel --no-deps dist/*.tar.gz --wheel-dir sdist-wheel
          python scripts/ci/python-check.py --wheel-dir sdist-wheel

      - name: Upload source distribution
        uses: actions/upload-artifact@v5
        with:
          name: pistoris-source
          path: dist/*.tar.gz
          if-no-files-found: error

  python-wheel:
    name: Python wheel (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            artifact: windows-x64
            setup_llvm: true
          - name: Windows ARM64
            os: windows-11-arm
            artifact: windows-arm64
            setup_llvm: false
          - name: macOS ARM64
            os: macos-15
            artifact: macos-arm64
            setup_llvm: false
          - name: Linux x64
            os: ubuntu-24.04
            artifact: linux-x64
            setup_llvm: false

    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/setup-llvm
        if: matrix.setup_llvm

      - name: Build wheel
        uses: pypa/cibuildwheel@v4.2.1
        with:
          package-dir: .
          output-dir: wheelhouse

      - name: Upload wheel
        uses: actions/upload-artifact@v5
        with:
          name: pistoris-wheel-${{ matrix.artifact }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  python:
    name: ${{ format('Python ({0}, {1})', matrix.name, matrix.python) }}
    needs: python-wheel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-2022
            artifact: windows-x64
            python: '3.12'
          - name: Windows x64
            os: windows-2022
            artifact: windows-x64
            python: '3.13'
          - name: Windows x64
            os: windows-2022
            artifact: windows-x64
            python: '3.14'
          - name: Windows ARM64
            os: windows-11-arm
            artifact: windows-arm64
            python: '3.12'
          - name: Windows ARM64
            os: windows-11-arm
            artifact: windows-arm64
            python: '3.13'
          - name: Windows ARM64
            os: windows-11-arm
            artifact: windows-arm64
            python: '3.14'
          - name: macOS ARM64
            os: macos-15
            artifact: macos-arm64
            python: '3.12'
          - name: macOS ARM64
            os: macos-15
            artifact: macos-arm64
            python: '3.13'
          - name: macOS ARM64
            os: macos-15
            artifact: macos-arm64
            python: '3.14'
          - name: Linux x64
            os: ubuntu-24.04
            artifact: linux-x64
            python: '3.12'
          - name: Linux x64
            os: ubuntu-24.04
            artifact: linux-x64
            python: '3.13'
          - name: Linux x64
            os: ubuntu-24.04
            artifact: linux-x64
            python: '3.14'

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v5
        with:
          name: pistoris-wheel-${{ matrix.artifact }}
          path: wheelhouse

      - name: Test installed wheel
        run: python scripts/ci/python-check.py --wheel-dir wheelhouse

  gate:
    name: Gate
    if: always()
    needs:
      - format
      - tidy
      - platform
      - sanitize
      - fuzz-build
      - python-source
      - python-wheel
      - python
    runs-on: ubuntu-24.04

    steps:
      - name: Verify required jobs
        if: >-
          needs.format.result != 'success' ||
          needs.tidy.result != 'success' ||
          needs.platform.result != 'success' ||
          needs.sanitize.result != 'success' ||
          needs.fuzz-build.result != 'success' ||
          needs.python-source.result != 'success' ||
          needs.python-wheel.result != 'success' ||
          needs.python.result != 'success'
        run: exit 1

      - run: echo "All required CI jobs passed"
